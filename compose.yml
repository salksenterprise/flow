services:
  workflow-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - workflow-data:/data
    restart: unless-stopped

  workflow-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "worker.main"]
    volumes:
      - workflow-data:/data
    restart: unless-stopped
    depends_on:
      workflow-api:
        condition: service_healthy
    healthcheck:
      disable: true

volumes:
  workflow-data:
